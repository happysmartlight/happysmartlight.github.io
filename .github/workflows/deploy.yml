name: Build & Deploy to GitHub Pages

on:
  # Tự chạy khi push lên nhánh chính
  push:
    branches: [master]
  # Cho phép bấm chạy thủ công trong tab Actions
  workflow_dispatch:

# Quyền cần thiết để deploy lên Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Mỗi lần chỉ deploy 1 bản, hủy bản đang chạy dở nếu có bản mới
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (nạp biến môi trường từ GitHub Secrets)
        env:
          VITE_TELEGRAM_BOT_TOKEN: ${{ secrets.VITE_TELEGRAM_BOT_TOKEN }}
          VITE_TELEGRAM_CHAT_ID: ${{ secrets.VITE_TELEGRAM_CHAT_ID }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
